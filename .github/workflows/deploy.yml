name: Nöbetçi Eczane Uygulaması

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Her gün Türkiye saatiyle 09:00'da (UTC 06:00) güncelle
    - cron: '0 6 * * *'
  workflow_dispatch:  # Manuel tetikleme için

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Kodu çek
      uses: actions/checkout@v3
    
    - name: 🐍 Python kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 📦 Gereksinimleri yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🔍 Eczane verilerini çek
      run: |
        python eczane.py &
        sleep 5
        curl -s http://localhost:5000 > index.html || echo "Sunucu başlatılamadı"
        pkill -f "python eczane.py" || true
      continue-on-error: true
    
    - name: 📄 Statik sayfayı oluştur
      run: |
        # Eğer index.html oluşmadıysa örnek oluştur
        if [ ! -f index.html ]; then
          echo '<!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Türkiye Nöbetçi Eczaneler</title>
            <style>
                body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f1f5f9; }
                .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
                h1 { color: #1e293b; }
                .update { color: #64748b; font-size: 0.9em; margin-top: 20px; }
                .acil { color: #dc2626; font-weight: 700; margin-top: 20px; }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>💊 Türkiye Nöbetçi Eczaneler</h1>
                <p>Uygulama başlatılıyor... Lütfen bekleyin.</p>
                <p class="update">📅 Son güncelleme: '$(date +"%d.%m.%Y %H:%M")'</p>
                <p class="acil">⚠️ Acil durumlarda 112'yi arayınız.</p>
            </div>
        </body>
        </html>' > index.html
        fi
    
    - name: 📤 GitHub Pages'e yayınla
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        keep_files: false
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: '🔄 Eczane verileri güncellendi - ${{ github.event.head_commit.message }}'

  # Render.com veya benzeri servisler için
  deploy-render:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: 📥 Kodu çek
      uses: actions/checkout@v3
    
    - name: 🚀 Render.com'a yayınla
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -n "$RENDER_DEPLOY_HOOK" ]; then
          curl -X POST "$RENDER_DEPLOY_HOOK"
          echo "✅ Render.com deploy tetiklendi"
        else
          echo "⚠️ RENDER_DEPLOY_HOOK bulunamadı"
        fi
